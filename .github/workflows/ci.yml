name: Node.js CI

on:
  push:
    branches: [ "**" ] # срабатывает на пуш в любую ветку
  pull_request:
    branches: [ "**" ] # срабатывает на PR в любую ветку

jobs:
  test:
    runs-on: self-hosted # Запуск на раннере Участника А

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

